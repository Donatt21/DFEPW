<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Aprendendo Classes</title>
</head>
    <style>
        .titulo{
            color: darkblue;
            text-align: center;
        }
        .caixa01{
            background-color: white;
            border: 2px solid black;
            padding: 20px;
            margin: 20px;
        }
        .caixa02{
            background-color: white;
            border: 2px solid black;
            padding: 20px;
            margin: 20px;
        }
        .p1{
            color: darkblue;
            font-weight: bold;
        }
        .p2{
            color: green;
            font-weight: bold;
            font-style: oblique;
            padding: 10px;
        }
        .p3{
            color: red;
            font-weight: bold;
        }
    </style>


<body>
    
    <h1 class="titulo">Aprendendo Classes com CSS</h1>

    <div class="caixa01">
        <p class="p1">Este é o primeiro parágrafo.</p>
        <p class="p2">Este é o segundo parágrafo.</p>
    </div>

    <div class="caixa02">
        <p class="p3">Este é o terceiro parágrafo.</p>
    </div>

</body>
</html>
