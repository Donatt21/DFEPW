<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horario e previsao do tempo</title>
  </head>
  <body>
    <h1>Horario e previsao do tempo</h1>

    <p>O programa mostrará uma saudação e uma recomendação do clima atual.</p>

    <script>
      const dataHora = new Date();
      const hora = dataHora.getHours();

      let previsaoTempo = prompt(
        "Como está o dia hoje? Digite chuvoso ou ensolarado: "
      );

      previsaoTempo = previsaoTempo.toLowerCase().trim();

      if (hora < 12) {
        alert("Bom dia na paz de Deus! 🙏");
        if (previsaoTempo === "chuvoso") {
          alert("Está chovendo, não esqueça o guarda-chuva");

        } else if (previsaoTempo === "ensolarado") {
          alert(
            "Passe o protetor ai, chocolate branco.Eu não quero que voce derreta!",
          );
        } else {
          alert("Nenhuma opção selecionada...");
        }
      } else if (hora < 18) {
        alert("Bom tarde na paz de Deus! 🙏");
        if (previsaoTempo === "chuvoso") {
          alert("Está chovendo, não esqueça o guarda-chuva");
        } else if (previsaoTempo === "ensolarado") {
          alert(
            "Passe o protetor ai, chocolate branco.Eu não quero que voce derreta!",
          );
        } else {
          alert("Nenhuma opção selecionada...");
        }
      } else {
        alert("Oi,boa noite! Sera que vai ter gol do rayan hoje? 💢");
        if (previsaoTempo === "chuvoso") {
          alert("Está chovendo, não esqueça o guarda-chuva");
        } else if (previsaoTempo === "ensolarado") {
          alert(
            "Passe o protetor ai, chocolate branco.Eu não quero que voce derreta!",
          );
        } else {
          alert("Nenhuma opção selecionada...");
        }
      }
    </script>
  </body>
</html>
