<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio em HTML</title>
</head>
<body>
    <h1>Audio em HTML</h1>

    <p>Clique no botão para ouvir o audio</p>

    <audio id="som" controls loop>
        <source
            src="audio/HINO DO PALMEIRAS.mp3"
            type="audio/mpeg"
        />
        Seu navegador não suporta a reprodução do audio.
    </audio>


    <script>
        const audio = document.getElementById("som");
        audio.volume = 0.5;

    </script>
</body>
</html>
