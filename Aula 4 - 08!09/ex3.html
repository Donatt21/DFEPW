<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex.: div, br e hr</title>

    <style>
        div{
            font-size: 20px;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
        }
            #principal {
            background: linear-gradient(to right, green 33.33%, white 33.33%, white 66.66%, green 66.66%);
            border: 2px solid black;
            color: #000;
            font-weight: bold;
        }
        hr{
            border: none;
            border-top: 3px solid black;
            width: 90%;
        }
        #secundaria{
            background: linear-gradient(to right, green 33.33%, white 33.33%,white 66.66%, green 66.6%);
            border: 2px solid black;
            color: black;
            font-weight: bold;
        }



    </style>



</head>
<body>
    <div id="principal">
        Esta é a primeira linha.
        <br>
        Esta é a segunda linha.
    </div>
    <hr>
    <div id="secundaria">
        Esta é outra divisão da Pagina
        <br>
        Aqui começa uma nova linha.
    </div>
</body>
</html>
