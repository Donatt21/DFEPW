<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabelas</title>
  </head>
  <body>
    <h1>Elementos das tabelas</h1>
    <p>
      As tabelas em HTML são usadas para organizar dados em linha e colunas.
    </p>
    <br />
    <hr />
    <br />
    <table border="1">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Idade</th>
          <th>Clube</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Guilherme</td>
          <td>19</td>
          <td>Palmeiras</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
