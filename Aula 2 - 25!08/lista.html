<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos de listas</title>
</head>
<body>
    <h1>Elementos de listas</h1>
    <p>As listas em HTML são utilizadas paraorganizar informações em uma sequencia.</p>

    <h2><strong>Lista não ordenada</strong></h2>   
        <ul>
            <li>A</li>
            <li>B</li>
            <li>C</li>
        </ul>

    <h2><strong>Lista ordenada</strong></h2>
        <ol>
            <li>A</li>
            <li>B</li>
        <li>C</li>
        </ol>

</body>
</html>
